specVersion: "3.1"
metadata:
  name: zestate.command
type: application
builder:
  componentPreload:
    excludes:
      - "zestate/command/thirdparty/**"
  minification:
    excludes:
      - "zestate/command/thirdparty/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: my402244
        app:
          name: ZEST_COMMAND
          description: Estate Command
          package: ZESTATE_CMD
          # add "transport: <request>" when the system asks for one
