# Same as ui5.yaml, against client 100, where the communication arrangements and AI keys are.
specVersion: "3.1"
metadata:
  name: zestate.command
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.136.0
        backend:
          - path: /sap
            # client 100
            destination: my402225
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
